ght" id="reader-right"></div></div><div id="floating-cards" aria-label="Cartas sobre a mesa"></div></dialog><dialog id="settings"><div class="dialog-top"><h2>Configurações</h2><button id="settings-close" aria-label="Fechar configurações">✕</button></div><form id="settings-form" class="panel editor"><label>Tema<select id="theme-choice"><option value="light">Claro</option><option value="dark">Escuro</option></select></label><label>Tamanho do texto<select id="font-choice"><option value="1">Normal</option><option value="1.15">Grande</option><option value="1.3">Muito grande</option></select></label><label><input id="contrast-choice" type="checkbox"> Alto contraste</label><label><input id="motion-choice" type="checkbox"> Reduzir movimentos</label></form></dialog><div id="toast" role="status"></div><script>document.getElementById("reader-left").append(document.querySelector(".reader-controls"),document.getElementById("find-form"),document.getElementById("search-results"));document.getElementById("reader-right").append(document.getElementById("viewer-status"),document.getElementById("match-controls"));</script><script src="vendor/pdf-lib.min.js"></script><script type="module" src="site.js"></script></body></html>
